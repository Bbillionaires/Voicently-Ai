<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voicently — Funnel</title>
<style>
  body{font-family:system-ui;margin:32px;max-width:900px}
  h1{margin:0 0 8px} .card{border:1px solid #e5e7eb;padding:16px;border-radius:10px;margin:14px 0}
  input,button,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #cbd5e1;border-radius:8px}
  button{cursor:pointer}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .muted{color:#64748b} .ok{color:#059669;font-weight:600}
</style>

<h1>VOICENTLY</h1>
<p class="muted">Autonomous Voice Intelligence</p>

<div class="card">
  <h2>Request Access</h2>
  <form id="lead">
    <input name="name" placeholder="Full name" required>
    <input type="email" name="email" placeholder="Email" required>
    <input name="phone" placeholder="Phone">
    <input name="org" placeholder="Organization">
    <input name="calls" placeholder="Daily call volume (estimate)">
    <textarea name="notes" placeholder="What problem are you trying to solve?"></textarea>
    <button>Submit</button>
  </form>
  <div id="msg" class="muted"></div>
</div>

<h2>How Voicently Helps</h2>
<div class="grid">
  <div class="card"><strong>Capture</strong><p>Answer & qualify inbound calls 24/7.</p></div>
  <div class="card"><strong>Convert</strong><p>Schedule, collect docs, and follow up.</p></div>
  <div class="card"><strong>Close</strong><p>Automations keep prospects moving.</p></div>
</div>

<script>
  // 👉 Replace with your Apps Script Web App URL
  const ENDPOINT = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE"; 

  // Basic UTM capture for funnel attribution
  const utm = Object.fromEntries(new URLSearchParams(location.search).entries());
  function buildPayload(fd){
    const body = Object.fromEntries(fd.entries());
    return {...body, ...utm, source: "site", path: location.pathname};
  }

  document.getElementById('lead').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = buildPayload(fd);
    const res = await fetch(ENDPOINT, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(payload) });
    const ok = res.ok;
    document.getElementById('msg').textContent = ok ? "✓ Thanks — we’ll reach out shortly." : "Submission failed. Please try again.";
    if (ok) { e.target.reset(); document.getElementById('msg').className="ok"; }
  });
</script>
